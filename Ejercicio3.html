<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3: Formularios en HTML5</title>
</head>
<body>
    <h1>Formularios en HTML5</h1>
    
    <form action="respuesta.html" method="GET">
        
        <fieldset>
            <legend>Entradas sin validación</legend>
            <p>
                <label for="textoSimple">Campo Simple:</label>
                <input type="text" id="textoSimple" name="textoSimple">
            </p>
            <p>
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena">
            </p>
            <p>
                <input type="hidden" name="campoOculto" value="valorOculto">
                <em>El campo oculto no es visible pero está en el formulario.</em>
            </p>
            <p>
                <label for="campoDeshabilitado">Deshabilitado:</label>
                <input type="text" id="campoDeshabilitado" name="campoDeshabilitado" value="No me puedes cambiar" disabled>
            </p>
            <p>
                <label for="campoSoloLectura">Solo lectura:</label>
                <input type="text" id="campoSoloLectura" name="campoSoloLectura" value="Solo me puedes leer" readonly>
            </p>
            <p>
                <label>Casilla de selección (Checkbox):</label><br>
                <input type="checkbox" id="opcion1" name="opcion1" value="A">
                <label for="opcion1">Opción A</label>
                <input type="checkbox" id="opcion2" name="opcion2" value="B">
                <label for="opcion2">Opción B</label>
            </p>
            <p>
                <label>Botones de radio (Radio):</label><br>
                <input type="radio" id="radio1" name="grupoRadio" value="1">
                <label for="radio1">Elección 1</label>
                <input type="radio" id="radio2" name="grupoRadio" value="2">
                <label for="radio2">Elección 2</label>
            </p>
            <p>
                <label for="listaDesplegable">Lista desplegable:</label>
                <select id="listaDesplegable" name="listaDesplegable">
                    <option value="op1">Opción 1</option>
                    <option value="op2">Opción 2</option>
                    <option value="op3">Opción 3</option>
                </select>
            </p>
            <p>
                <label for="fecha">Selector de Fecha:</label>
                <input type="date" id="fecha" name="fecha">
            </p>
            <p>
                <label for="hora">Selector de Hora:</label>
                <input type="time" id="hora" name="hora">
            </p>
            <p>
                <label for="color">Selector de Color:</label>
                <input type="color" id="color" name="color">
            </p>
        </fieldset>

        <fieldset>
            <legend>Entradas con validación</legend>
            <p>
                <label for="campoRequerido">Campo Requerido (*):</label>
                <input type="text" id="campoRequerido" name="campoRequerido" required>
            </p>
            <p>
                <label for="email">Correo Electrónico (Email):</label>
                <input type="email" id="email" name="email">
            </p>
            <p>
                <label for="enteros">Números Enteros Limitados (1 a 10):</label>
                <input type="number" id="enteros" name="enteros" min="1" max="10">
            </p>
            <p>
                <label for="decimales">Números Decimales (ej. 10.5):</label>
                <input type="number" id="decimales" name="decimales" step="0.01">
            </p>
            <p>
                <label for="url">Dirección Web (URL):</label>
                <input type="url" id="url" name="url" placeholder="https://ejemplo.com">
            </p>
            <p>
                <label for="telefono">Número Telefónico (Formato: 123-456-7890):</label>
                <input type="tel" id="telefono" name="telefono" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" placeholder="123-456-7890">
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Enviar formulario">
        </p>

    </form>
</body>
</html>
