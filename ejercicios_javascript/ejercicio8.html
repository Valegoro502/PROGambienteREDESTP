<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 8</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <input type="number" id="n1" value="0">
    <input type="number" id="n2" value="0">
    <input type="number" id="n3" value="0">
    <br><br>
    <button onclick="sumar()">Suma</button>
    <button onclick="promedio()">Promedio</button>
    <button onclick="mayor()">Mayor</button>
    <br><br>
    <label>Resultado:</label>
    <input type="text" id="resultado" readonly>
    
    <script>
        function getVals() {
            return [
                Number(document.getElementById('n1').value),
                Number(document.getElementById('n2').value),
                Number(document.getElementById('n3').value)
            ];
        }
        function setRes(val) {
            document.getElementById('resultado').value = val;
        }
        function sumar() {
            let v = getVals();
            setRes(v[0] + v[1] + v[2]);
        }
        function promedio() {
            let v = getVals();
            setRes((v[0] + v[1] + v[2]) / 3);
        }
        function mayor() {
            let v = getVals();
            setRes(Math.max(v[0], v[1], v[2]));
        }
    </script>
    <br><br><a href="index.html">Volver al índice</a>
</body>
</html>
