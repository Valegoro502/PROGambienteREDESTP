<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 17: Formulario ABM Modal</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            word-wrap: break-word;
            color: #777;
            font-size: 14px;
            line-height: 1.2;
        }
        .bg-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            padding: 5px;
            box-sizing: border-box;
            user-select: none;
        }
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(to bottom, #a3d5e3 60%, #82f0ab 40%);
            padding: 30px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            border-radius: 0; /* as seen in screenshot */
            z-index: 1000;
            width: 400px;
            color: black;
        }
        .modal h2 {
            margin-top: 0;
        }
        .modal input {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 5px;
        }
        .modal-buttons {
            margin-top: 50px;
            text-align: right;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.2);
            z-index: 999;
        }
        button:disabled {
            background-color: #eee;
            color: #aaa;
            cursor: not-allowed;
            border: 1px solid #ccc;
        }
        button {
            background-color: #f9f9f9;
            color: black;
            border: 1px solid #777;
            padding: 5px 10px;
            margin-left: 2px;
            font-size: 14px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="bg-text" id="bgText"></div>
    <div class="overlay"></div>
    
    <div class="modal">
        <h2>FORMULARIO ABM</h2>
        <form id="abmForm">
            <label>Apellido:</label><br>
            <input type="text" id="apeModal" name="apellido" onkeyup="validarModal()" oninput="validarModal()"><br>
            
            <label>Nombres:</label><br>
            <input type="text" id="nomModal" name="nombres" onkeyup="validarModal()" oninput="validarModal()"><br>
            
            <label>Saldo:</label><br>
            <input type="number" id="saldoModal" name="saldo" onkeyup="validarModal()" oninput="validarModal()"><br>

            <div class="modal-buttons">
                <button type="button" id="btnBlanquear" disabled onclick="blanquearModal()">Blanquear</button>
                <button type="button" id="btnAlta" disabled onclick="enviarAccion('alta.html')">Alta</button>
                <button type="button" id="btnModi" disabled onclick="enviarAccion('modi.html')">Modi</button>
                <button type="button" id="btnBaja" disabled onclick="enviarAccion('baja.html')">Baja</button>
            </div>
        </form>
    </div>

    <script>

        var bg = document.getElementById('bgText');
        var text = "";
        for(var i=0; i<3000; i++) { text += "wasd wasd wasd wasd wasd wasd wasd "; }
        bg.textContent = text;

        function validarModal() {
            var ape = document.getElementById('apeModal').value;
            var nom = document.getElementById('nomModal').value;
            var saldoStr = document.getElementById('saldoModal').value;
            var saldo = parseFloat(saldoStr);

            var btnBlanquear = document.getElementById('btnBlanquear');
            var btnAlta = document.getElementById('btnAlta');
            var btnModi = document.getElementById('btnModi');
            var btnBaja = document.getElementById('btnBaja');

            if (ape.length > 0 || nom.length > 0 || saldoStr.length > 0) {
                btnBlanquear.disabled = false;
            } else {
                btnBlanquear.disabled = true;
            }

            var esValido = ape.trim() !== '' && nom.trim() !== '' && !isNaN(saldo) && saldo >= 100 && saldo <= 1000;

            if (esValido) {
                btnAlta.disabled = false;
                btnModi.disabled = false;
                btnBaja.disabled = false;
            } else {
                btnAlta.disabled = true;
                btnModi.disabled = true;
                btnBaja.disabled = true;
            }
        }

        function blanquearModal() {
            document.getElementById('apeModal').value = '';
            document.getElementById('nomModal').value = '';
            document.getElementById('saldoModal').value = '';
            validarModal();
        }

        function enviarAccion(url) {
            var form = document.getElementById('abmForm');
            form.action = url;
            form.method = 'GET';
            form.target = '_blank';
            form.submit();
        }
    </script>
    <a href="../index.html" style="position: absolute; top: 10px; left: 10px; z-index: 1001; background: white; padding: 5px; text-decoration: none; border: 1px solid black; color: black;">Volver a los ejercicios</a>
</body>
</html>
